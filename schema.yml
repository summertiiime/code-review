version: 2 
 
models: 
  - name: stg_comp 
    description: flattened HR extract, pay cols come through as strings 
    columns: 
      - name: employee_id 
        tests: 
          - not_null 
 
  - name: department_lookup 
    description: dept ref, one row per dept per FY 
    columns: 
      - name: dept_id 
        tests: 
          - not_null 
 
  - name: comp_summary 
    description: Compensation by employee and year, for department reporting. 
    columns: 
      - name: employee_id 
        tests: 
          - not_null 
      - name: other_pay 
        tests: 
          - not_null 
      - name: total_comp 
        tests: 
          - not_null 
 
  - name: headcount_monthly 
    description: "" 
    columns: 
      - name: dept_id 
        tests: 
          - not_null 
